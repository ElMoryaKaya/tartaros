<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Produit</title>
</head>
<body>
    <h2>Ajouter un Produit</h2>

    <form action="traitement_ajout_produit.php" method="post">
        <label for="nom_produit">Nom du Produit:</label>
        <input type="text" id="nom_produit" name="nom_produit" required><br>

        <label for="prix">Prix:</label>
        <input type="number" id="prix" name="prix" step="0.01" required><br>

        <label for="note">Note:</label>
        <input type="number" id="note" name="note" min="1" max="5" required><br>

        <label for="date_sortie">Date de Sortie:</label>
        <input type="date" id="date_sortie" name="date_sortie" required><br>

        <input type="submit" value="Ajouter">
    </form>
</body>
</html>
